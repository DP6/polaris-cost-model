dataformCoreVersion: 3.0.0

defaultProject: dp6-ci-polaris
defaultLocation: US
defaultDataset: billing_polaris_mart
defaultAssertionDataset: billing_polaris_assertions

vars:
  # origem (cross-project — a SA do Dataform precisa de bigquery.dataViewer aqui)
  source_project: dp6-billing-voucher
  source_dataset: billing_dp6_ci_polaris
  source_view: vw_dp6_ci_polaris
  # datasets alvo (todos em US, no dp6-ci-polaris)
  staging_dataset: billing_polaris_stg
  mart_dataset: billing_polaris_mart
  reporting_dataset: billing_polaris_reporting
  # parâmetros travados na Fase 2 (validation/RESULTADOS.md)
  lookback_days: "45"
  freshness_threshold_hours: "36"
  label_keys: "environment,app,managed-by"
  timezone: "America/Sao_Paulo"
