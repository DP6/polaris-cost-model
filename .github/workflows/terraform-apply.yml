name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/environments/**"
      - "terraform/modules/**"
      - ".github/workflows/terraform-*.yml"

# gate = o plan revisado no PR. Sem aprovacao manual (padrao do polaris-cost-control / atlas).
permissions:
  contents: read
  id-token: write

concurrency: terraform-apply

jobs:
  apply:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        env: [dev]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_APPLY }}
          service_account: ${{ secrets.WIF_SA_APPLY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve
