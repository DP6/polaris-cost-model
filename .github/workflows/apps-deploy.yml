name: Apps Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/apps-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  AR: us-central1-docker.pkg.dev/dp6-ci-polaris/apps

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_APPLY }}
          service_account: ${{ secrets.WIF_SA_APPLY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # servico unico: a imagem da API ja embute o build do SPA (apps/web).
      # contexto = raiz do repo para o Dockerfile enxergar apps/web e apps/api.
      - name: build & push
        run: |
          IMG="${AR}/billing-api:${GITHUB_SHA::12}"
          docker build -f apps/api/Dockerfile -t "$IMG" .
          docker push "$IMG"
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      # So dev por ora: environments/prod ainda nao foi aplicado (terraform-apply
      # roda matrix [dev]). Quando prod entrar, deployar billing-api-prod tambem.
      - name: deploy dev
        run: |
          gcloud run deploy billing-api-dev \
            --region "$REGION" --image "$IMG" --quiet
